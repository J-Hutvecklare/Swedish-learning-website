<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>瑞典语学习 / Swedish Learning</title>
<style>

:root{
  --blue:#006aa7; --yellow:#fecc00; --blue-d:#004d7a; --blue-s:#e7f3fa;
  --text:#1a2332; --muted:#5c6b7a; --border:#cfdce8; --bg:#f3f8fc; --card:#fff;
  --ok:#1b7a4c; --bad:#c0392b; --radius:14px;
  --font:"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--text);min-height:100vh;line-height:1.55;
  background:radial-gradient(ellipse 90% 55% at 0% -10%,rgba(254,204,0,.22),transparent),
  radial-gradient(ellipse 70% 45% at 100% 0%,rgba(0,106,167,.14),transparent),var(--bg)}
.app{max-width:980px;margin:0 auto;padding:1rem 1rem 3rem}
.view{display:none;animation:fade .25s ease}.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.topbar{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;justify-content:space-between;
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:.75rem 1rem;box-shadow:0 4px 18px rgba(0,106,167,.07);margin-bottom:1.25rem}
.brand{font-weight:800;color:var(--blue);font-size:1.15rem;letter-spacing:.03em;display:flex;align-items:baseline;flex-wrap:wrap;gap:.35rem .55rem}
.brand small{display:inline;font-weight:500;color:var(--muted);font-size:.75rem}
.top-actions{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
select,input[type=text]{border:1px solid var(--border);border-radius:10px;padding:.5rem .7rem;
  font:inherit;background:#fff;color:var(--text)}
select:focus,input[type=text]:focus{outline:2px solid rgba(0,106,167,.3);border-color:var(--blue)}
.btn{border:none;border-radius:10px;padding:.55rem 1.05rem;font:inherit;font-weight:700;cursor:pointer;
  transition:transform .1s,background .15s}.btn:active{transform:scale(.97)}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue-d)}
.btn-accent{background:var(--yellow);color:var(--blue-d)}.btn-ghost{background:var(--blue-s);color:var(--blue)}
.btn-ok{background:var(--ok);color:#fff}.btn-bad{background:var(--bad);color:#fff}
.btn-speak{background:transparent;border:1px solid var(--blue);color:var(--blue);
  padding:.25rem .55rem;border-radius:8px;font-size:.75rem;font-weight:700;cursor:pointer}
.btn-speak:hover{background:var(--blue-s)}
.hero{text-align:center;padding:clamp(1.5rem,6vw,3.5rem) 0 2rem;position:relative}
.hero::before{content:"";position:absolute;inset:0 0 auto;height:10px;background:var(--blue);border-radius:0}
.hero-flag{height:8px;background:var(--yellow);margin:10px auto 1.25rem;max-width:220px;border-radius:4px}
.hero-landmark{width:100%;margin:0.85rem 0 1rem;overflow:hidden;line-height:0;
  background:linear-gradient(180deg,rgba(0,106,167,.08),rgba(254,204,0,.12))}
.hero-landmark img{display:block;width:100%;height:clamp(160px,32vw,280px);object-fit:cover;object-position:center 45%;filter:saturate(.95) contrast(1.03)}
.phase-tabs .count-select{border:1px solid var(--border);border-radius:8px;padding:.4rem .55rem;
  font:inherit;font-weight:700;font-size:.85rem;color:var(--blue);background:#fff;cursor:pointer}
.phase-tabs .count-select:focus{outline:2px solid rgba(0,106,167,.3);border-color:var(--blue)}
.phase-tabs #btnConfirm{padding:.4rem .85rem;font-size:.85rem;border-radius:8px}
.hero h1{font-size:clamp(2.6rem,10vw,4rem);color:var(--blue);font-weight:900;letter-spacing:.02em;margin-bottom:.4rem}
.hero p{color:var(--muted);font-size:1.05rem;max-width:28rem;margin:0 auto 1.5rem}
.hero-card{display:inline-flex;flex-direction:column;gap:.75rem;align-items:stretch;
  background:var(--card);border:1px solid var(--border);border-radius:18px;padding:1.25rem 1.4rem;
  box-shadow:0 10px 30px rgba(0,106,167,.1);min-width:min(100%,320px)}
.hero-card label{font-size:.85rem;font-weight:700;color:var(--muted);text-align:left}
.page-head{margin-bottom:1rem}
.page-head h2{color:var(--blue);font-size:1.45rem}
.page-head p{color:var(--muted);font-size:.9rem}
.tabs{display:flex;flex-wrap:wrap;gap:.35rem;background:var(--card);padding:.5rem;border-radius:var(--radius);
  border:1px solid var(--border);margin-bottom:1rem;box-shadow:0 4px 18px rgba(0,106,167,.06)}
.tab{flex:1 1 auto;min-width:4.2rem;border:none;background:transparent;color:var(--muted);
  padding:.55rem .7rem;border-radius:10px;font-weight:700;cursor:pointer}
.tab.active{background:var(--yellow);color:var(--blue-d)}
.panel{display:none}.panel.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:1rem 1.1rem;box-shadow:0 4px 18px rgba(0,106,167,.06);margin-bottom:1rem}
.card h3{color:var(--blue);font-size:.95rem;margin-bottom:.7rem;display:flex;align-items:center;gap:.4rem}
.card h3::before{content:"";width:4px;height:1em;background:var(--yellow);border-radius:2px}
.placeholder{text-align:center;padding:2.5rem 1rem;color:var(--muted)}
.placeholder h3{color:var(--blue);margin-bottom:.4rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-bottom:.75rem}
.count-btns{display:flex;flex-wrap:wrap;gap:.4rem}
.count-btn{border:2px solid var(--blue);background:transparent;color:var(--blue);
  padding:.4rem .85rem;border-radius:999px;font-weight:700;cursor:pointer}
.count-btn.active{background:var(--blue);color:#fff}
.phase-tabs{display:flex;flex-wrap:wrap;gap:.35rem;margin:.75rem 0}
.phase-btn{border:1px solid var(--border);background:#fff;padding:.4rem .8rem;border-radius:8px;
  font-weight:700;font-size:.85rem;color:var(--muted);cursor:pointer}
.phase-btn.active{background:var(--blue);border-color:var(--blue);color:#fff}
.word-list{list-style:none;display:grid;gap:.65rem}
.word-item{padding:.85rem 1rem;background:var(--blue-s);border-radius:12px;border-left:4px solid var(--yellow)}
.word-top{display:flex;flex-wrap:wrap;gap:.45rem .7rem;align-items:baseline}
.word-sv{font-size:1.15rem;font-weight:800;color:var(--blue)}
.word-zh{font-weight:600}
.word-forms{font-size:.8rem;color:var(--blue-d);background:rgba(254,204,0,.35);padding:.1rem .45rem;border-radius:6px}
.word-ex{font-size:.85rem;color:var(--muted);font-style:italic;margin-top:.25rem}.word-ex-zh{display:block;font-style:normal;color:var(--text);margin-top:.2rem;font-size:.85rem}
.tag{font-size:.7rem;font-weight:800;padding:.12rem .4rem;border-radius:5px;margin-left:auto}
.tag.yes{background:#d4edda;color:var(--ok)}.tag.wb{background:#fff3cd;color:#8a6d00}
.flash{min-height:190px;border:2px solid var(--blue);border-radius:18px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:1.4rem;cursor:pointer;user-select:none;margin-bottom:1rem;
  background:linear-gradient(145deg,#fff,var(--blue-s));transition:box-shadow .2s}
.flash.flipped{border-color:var(--yellow);background:linear-gradient(145deg,#fffef5,#fff6c8)}
.flash-prompt{font-size:.8rem;color:var(--muted);margin-bottom:.4rem}
.flash-main{font-size:clamp(1.5rem,4vw,2.1rem);font-weight:900;color:var(--blue);text-align:center}
.flash-sub{min-height:1.5em;font-size:1.2rem;font-weight:700;margin-top:.4rem}
.flash-hint{font-size:.75rem;color:var(--muted);margin-top:.6rem}
.mode-switch{display:inline-flex;background:var(--blue-s);border-radius:10px;padding:.2rem;gap:.15rem;margin-bottom:1rem}
.mode-btn{border:none;background:transparent;padding:.4rem .85rem;border-radius:8px;font-weight:700;
  color:var(--muted);cursor:pointer;font-size:.85rem}
.mode-btn.active{background:#fff;color:var(--blue);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.center{text-align:center}.actions{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center}
.progress{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:.7rem}
.spell-box{max-width:360px;margin:0 auto 1rem;display:flex;flex-direction:column;gap:.6rem}
.spell-box input{width:100%;text-align:center;font-size:1.1rem}
.feedback{min-height:1.3em;font-weight:700}.feedback.ok{color:var(--ok)}.feedback.bad{color:var(--bad)}
.done{text-align:center;padding:2rem 1rem;background:var(--blue-s);border:2px solid var(--yellow);border-radius:var(--radius)}
.done h3{color:var(--blue);margin-bottom:.5rem}
.wb-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:1rem}
.stat{text-align:center;padding:.75rem;background:var(--blue-s);border-radius:12px}
.stat b{display:block;font-size:1.45rem;color:var(--blue)}
.stat span{font-size:.75rem;color:var(--muted)}
.wb-list{list-style:none;max-height:240px;overflow:auto;border:1px solid var(--border);border-radius:10px;padding:.35rem}
.wb-list li{display:flex;justify-content:space-between;gap:.5rem;align-items:center;
  padding:.4rem .5rem;font-size:.85rem;border-bottom:1px solid #eef3f7}
.wb-list li:last-child{border-bottom:none}
.empty{text-align:center;color:var(--muted);padding:1.5rem;font-size:.9rem}
.quiz-q{font-size:1.5rem;font-weight:800;color:var(--blue);margin:.5rem 0 1rem}
footer{text-align:center;margin-top:2rem;font-size:.75rem;color:var(--muted)}
@media(max-width:480px){.wb-stats{grid-template-columns:1fr}.brand{font-size:1rem}}

.lang-label{font-size:.85rem;font-weight:700;color:var(--muted);margin-right:.25rem}
.hero p{max-width:34rem}

/* Grammar */
.grammar-layout{display:grid;grid-template-columns:220px 1fr;gap:1rem;align-items:start}
.grammar-nav{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:.5rem;box-shadow:0 4px 18px rgba(0,106,167,.06);position:sticky;top:.75rem}
.grammar-nav-title{font-size:.75rem;font-weight:800;color:var(--muted);padding:.4rem .55rem .55rem;letter-spacing:.04em}
.g-topic{display:block;width:100%;text-align:left;border:none;background:transparent;color:var(--muted);
  padding:.55rem .65rem;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;margin-bottom:.2rem}
.g-topic:hover{background:var(--blue-s);color:var(--blue)}
.g-topic.active{background:var(--yellow);color:var(--blue-d)}
.g-topic .g-done{display:inline-block;margin-left:.35rem;font-size:.7rem;color:var(--ok);font-weight:800}
.grammar-main{min-width:0}
.g-rules{margin:.5rem 0 1rem;padding-left:1.1rem}
.g-rules li{margin:.35rem 0;color:var(--text)}
.g-table-wrap{overflow:auto;margin:0 0 1rem;border:1px solid var(--border);border-radius:10px}
.g-table{width:100%;border-collapse:collapse;font-size:.9rem}
.g-table th,.g-table td{padding:.45rem .65rem;border-bottom:1px solid #e8eef4;text-align:left}
.g-table th{background:var(--blue-s);color:var(--blue);font-weight:800}
.g-table tr:last-child td{border-bottom:none}
.g-table caption{caption-side:top;text-align:left;font-weight:800;color:var(--blue);padding:.5rem .65rem;font-size:.85rem}
.g-examples{list-style:none;display:grid;gap:.55rem;margin:0 0 .25rem}
.g-examples li{padding:.65rem .8rem;background:var(--blue-s);border-radius:10px;border-left:4px solid var(--yellow)}
.g-examples .sv{font-weight:800;color:var(--blue)}
.g-examples .tr{display:block;font-size:.85rem;color:var(--muted);margin-top:.15rem}
.g-ex{margin-bottom:1rem;padding-bottom:.85rem;border-bottom:1px dashed var(--border)}
.g-ex:last-child{border-bottom:none;margin-bottom:0}
.g-ex-line{display:flex;flex-wrap:wrap;align-items:center;gap:.25rem .3rem;font-weight:700;margin-bottom:.35rem;line-height:1.7}
.g-ex-line .g-sv{color:var(--text)}
.g-ex-line .g-lemma{color:var(--muted);font-weight:700;font-size:.95rem}
.g-ex input.g-blank{width:9.5rem;min-width:6.5rem;padding:.35rem .5rem;border:2px solid var(--blue);border-radius:8px;
  font:inherit;font-weight:800;color:var(--blue);text-align:center;background:#fff}
.g-ex input.g-blank:focus{outline:2px solid rgba(0,106,167,.28);border-color:var(--blue-d)}
.g-ex input.g-blank:disabled{background:var(--blue-s)}
.g-gloss{font-size:.85rem;color:var(--muted);font-weight:500;margin-bottom:.15rem}
.g-ex .g-fb{margin-top:.35rem;font-size:.85rem;font-weight:700}
.g-ex .g-fb.ok{color:var(--ok)}.g-ex .g-fb.bad{color:var(--bad)}
.g-ex .g-explain{margin-top:.25rem;font-size:.85rem;color:var(--muted);font-weight:500}
.g-score{margin-top:.75rem;padding:.75rem;background:var(--blue-s);border-radius:10px;font-weight:700;color:var(--blue)}
@media(max-width:720px){
  .grammar-layout{grid-template-columns:1fr}
  .grammar-nav{position:static;display:flex;flex-wrap:wrap;gap:.25rem;padding:.45rem}
  .grammar-nav-title{width:100%}
  .g-topic{width:auto;flex:1 1 auto;min-width:8rem}
}
</style>
</head>
<body>
<div class="app">
  <!-- HOME -->
  <section class="view active" id="view-home">
    <div class="topbar">
      <div class="brand"><span id="homeBrand">瑞典语学习</span><small>Svenska för dig</small></div>
      <div class="top-actions">
        <label class="lang-label" for="langSelect" id="langLabel">语言 / Language</label>
        <select id="langSelect" aria-label="语言 / Language">
          <option value="zh">中文</option>
          <option value="en">English</option>
        </select>
        <button type="button" class="btn btn-accent" id="btnStart">开始学习 / Start</button>
      </div>
    </div>
    <div class="hero">
      <div class="hero-flag"></div>
      <h1>Hej!</h1>
      <div class="hero-landmark">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/76/Panorama_Gamla_stan_2012.jpg/1280px-Panorama_Gamla_stan_2012.jpg" alt="Stockholm Gamla stan panorama" width="1280" height="300" loading="lazy" decoding="async" referrerpolicy="no-referrer" />
      </div>
      <p id="homeSubtitle">欢迎来到瑞典语学习网，选择语言后开始学习</p>
    </div>
  </section>

  <!-- LEARN -->
  <section class="view" id="view-learn">
    <div class="topbar">
      <div class="brand"><span id="learnBrand">瑞典语学习</span><small>Svenska för dig</small></div>
      <div class="top-actions">
        <button type="button" class="btn btn-accent" id="btnHome">返回首页</button>
      </div>
    </div>
    <div class="page-head"><h2 id="learnTitle">词汇</h2><p id="learnSub">高频词汇学习</p></div>
    <nav class="tabs" id="learnTabs">
      <button type="button" class="tab active" data-tab="vocab" id="tabBtnVocab">词汇</button>
      <button type="button" class="tab" data-tab="grammar" id="tabBtnGrammar">语法</button>
    </nav>
    <div class="panel active" id="tab-vocab"></div>
    <div class="panel" id="tab-grammar"></div>
  </section>
</div>

":"我有一个临时职位。","english":"temporary position","exampleEn":"I have a temporary position."},{"id":"w1053","swedish":"praktik","chinese":"实习","example":"Jag gör praktik.","pos":"noun","forms":"en praktik / praktiken","category":"日常用语","exampleZh":"我在实习。","english":"internship","exampleEn":"I am doing an internship."}];

const COUNTS = [5,10,15,20];
const LS_MASTERED = "sv-learn-mastered-v2";
const LS_WORDBOOK = "sv-learn-wordbook-v2";
const LS_LEARNED = "sv-learn-learned-v2";

/* ========== STATE ========== */
const state = {
  uiLang: localStorage.getItem(LS_UI_LANG) || "zh",
  tab: "vocab",
  count: 10,
  phase: "setup", // setup | list | flash | quiz | wordbook | stats
  grammarTopic: "nouns",
  grammarAnswers: {},
  grammarChecked: {},
  flashMode: "cn2sv", // cn2sv | sv2cn | spell  (cn2sv means meaning→SV)
  practiceSource: "main",
  batch: [],
  index: 0,
  wbBatch: [],
  wbIndex: 0,
  flipped: false,
  spellFeedback: "",
  quizFeedback: "",
  quizDir: "cn2sv",
  mastered: loadSet(LS_MASTERED),
  wordbook: loadSet(LS_WORDBOOK),
  learned: loadSet(LS_LEARNED),
};
for (const id of state.mastered) state.learned.add(id);
saveSet(LS_LEARNED, state.learned);

function loadSet(key){
  try{ const a=JSON.parse(localStorage.getItem(key)||"[]"); return new Set(a); }catch{ return new Set(); }
}
function saveSet(key, set){ localStorage.setItem(key, JSON.stringify([...set])); }
function isMastered(id){ return state.mastered.has(id); }
function inWordbook(id){ return state.wordbook.has(id); }
function markLearned(id){
  if(!id || state.learned.has(id)) return;
  state.learned.add(id);
  saveSet(LS_LEARNED, state.learned);
}
function learnedCount(){ return state.learned.size; }

/* ========== TTS ========== */
function speak(text){
  if(!window.speechSynthesis){ alert("Speech synthesis not supported."); return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="sv-SE"; u.rate=0.9;
  const v=speechSynthesis.getVoices().find(x=>x.lang==="sv-SE"||x.lang.startsWith("sv"));
  if(v) u.voice=v;
  speechSynthesis.speak(u);
}
if(window.speechSynthesis) speechSynthesis.onvoiceschanged=()=>{};

/* ========== BATCH ========== */
function shuffle(a){ const x=a.slice(); for(let i=x.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [x[i],x[j]]=[x[j],x[i]]; } return x; }
function practicePool(){ return VOCAB.filter(w=>!isMastered(w.id)); }
function buildBatch(){
  const pool=practicePool();
  if(!pool.length) return [];
  return shuffle(pool).slice(0, Math.min(state.count, pool.length));
}
function norm(s){ return (s||"").trim().toLowerCase().normalize("NFC").replace(/\s+/g," "); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function activeBatch(){ return state.practiceSource==="wordbook" ? state.wbBatch : state.batch; }
function getIdx(){ return state.practiceSource==="wordbook" ? state.wbIndex : state.index; }
function setIdx(i){ if(state.practiceSource==="wordbook") state.wbIndex=i; else state.index=i; }
function cur(){ return activeBatch()[getIdx()]||null; }
function isWbPractice(){ return state.practiceSource==="wordbook"; }
function practiceHeading(mainTitle){ return isWbPractice() ? t("intensifyTitle") : mainTitle; }
function returnToMainBtn(){
  return isWbPractice()
    ? `<button type="button" class="btn btn-ghost" id="btnBackMain">${t("backMain")}</button>`
    : "";
}

/* ========== NAV / I18N APPLY ========== */
function showView(id){
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
function applyHomeI18n(){
  document.getElementById("langLabel").textContent = t("langLabel");
  document.getElementById("btnStart").textContent = t("start");
  document.getElementById("homeSubtitle").textContent = t("homeSub");
  document.getElementById("homeBrand").textContent = t("brandLearn");
  document.documentElement.lang = state.uiLang==="en" ? "en" : "zh-CN";
}
function applyLearnChrome(){
  document.getElementById("btnHome").textContent = t("homeBtn");
  document.getElementById("learnBrand").textContent = t("brandLearn");
  document.getElementById("tabBtnVocab").textContent = t("tabVocab");
  document.getElementById("tabBtnGrammar").textContent = t("tabGrammar");
  updateLearnPageHead();
}
function updateLearnPageHead(){
  if(state.tab==="grammar"){
    document.getElementById("learnTitle").textContent = t("grammarTitle");
    document.getElementById("learnSub").textContent = t("grammarSub");
  } else {
    document.getElementById("learnTitle").textContent = t("learnTitle");
    document.getElementById("learnSub").textContent = t("learnSub");
  }
}
function goLearn(){
  localStorage.setItem(LS_UI_LANG, state.uiLang);
  applyLearnChrome();
  showView("view-learn");
  state.tab="vocab";
  syncLearnTabs();
  renderVocab();
}
function syncLearnTabs(){
  document.querySelectorAll("#learnTabs .tab").forEach(t=>t.classList.toggle("active", t.dataset.tab===state.tab));
  document.querySelectorAll("#view-learn .panel").forEach(p=>p.classList.remove("active"));
  document.getElementById("tab-"+state.tab).classList.add("active");
}

/* ========== VOCAB UI ========== */
function renderVocab(){
  const el=document.getElementById("tab-vocab");
  el.innerHTML = `
    <div class="card">
      <div class="phase-tabs" id="phaseTabs">
        <button type="button" class="phase-btn${state.phase==="setup"?" active":""}" data-phase="setup" id="btnPickCount">${t("pickCount")}</button>
        <select class="count-select" id="countSelect" aria-label="${t("pickCount")}">
          ${COUNTS.map(n=>`<option value="${n}"${state.count===n?" selected":""}>${n}</option>`).join("")}
        </select>
        <button type="button" class="btn btn-primary" id="btnConfirm">${t("confirm")}</button>
        <button type="button" class="phase-btn${state.phase==="list"?" active":""}" data-phase="list">${t("wordList")}</button>
        <button type="button" class="phase-btn${state.phase==="flash"?" active":""}" data-phase="flash">${t("flash")}</button>
        <button type="button" class="phase-btn${state.phase==="quiz"?" active":""}" data-phase="quiz">${t("quiz")}</button>
        <button type="button" class="phase-btn${state.phase==="wordbook"?" active":""}" data-phase="wordbook">${t("wordbook")}</button>
        <button type="button" class="phase-btn${state.phase==="stats"?" active":""}" data-phase="stats">${t("stats")}</button>
      </div>
    </div>
    <div class="card" id="vocabBody"></div>
  `;
  renderVocabBody();
  bindVocab();
}

function renderStatsCard(){
  return `<h3>${t("statsTitle")}</h3>
    <div class="wb-stats">
      <div class="stat"><b>${learnedCount()}</b><span>${t("learned")}</span></div>
      <div class="stat"><b>${state.mastered.size}</b><span>${t("masteredStat")}</span></div>
      <div class="stat"><b>${state.wordbook.size}</b><span>${t("wbStat")}</span></div>
    </div>
    <p class="empty" style="padding:.75rem 0 0">${t("statsHint")}</p>`;
}

function renderVocabBody(){
  const el=document.getElementById("vocabBody");
  if(!el) return;

  if(state.phase==="stats"){
    el.innerHTML = renderStatsCard();
    return;
  }

  if(state.phase==="wordbook"){
    const wb=[...state.wordbook].map(id=>VOCAB.find(w=>w.id===id)).filter(Boolean);
    el.innerHTML=`<h3>${t("wbTitle")}</h3>
      <p class="progress">${wb.length} ${t("wbCount")}</p>
      <div class="actions" style="margin-bottom:1rem">
        <button type="button" class="btn btn-primary" id="btnPracticeWB" ${wb.length?"":"disabled"}>${t("strengthenWB")}</button>
        <button type="button" class="btn btn-ghost" id="btnClearWB">${t("clearWB")}</button>
        ${state.wbBatch.length?`<button type="button" class="btn btn-ghost" id="btnBackMain">${t("backMain")}</button>`:""}
      </div>
      <ul class="word-list">${wb.length?wb.map(w=>wordItemHtml(w)).join(""):`<li class="empty">${t("wbEmpty")}</li>`}</ul>`;
    return;
  }

  if(state.phase==="setup"){
    el.innerHTML=`<h3>${t("startLearn")}</h3><p class="empty">${t("startHint")}</p>`;
    return;
  }

  const batch=activeBatch();
  if(!batch.length){
    el.innerHTML=`<h3>${practiceHeading(t("wordList"))}</h3><p class="empty">${
      isWbPractice()?t("wbEmptyQueue"):t("needConfirm")
    }</p>
      <div class="actions">${returnToMainBtn()}</div>`;
    return;
  }

  if(state.phase==="list"){
    el.innerHTML=`<h3>${practiceHeading(t("wordList"))}</h3>
      <p class="progress">${isWbPractice()?t("wbPracticeLabel"):t("batchWords")} ${batch.length} ${t("wordsUnit")}${isWbPractice()?"":t("exclMastered")}</p>
      <ul class="word-list">${batch.map(w=>wordItemHtml(w)).join("")}</ul>
      <div class="actions" style="margin-top:1rem">
        <button type="button" class="btn btn-accent" id="btnToFlash">${t("startFlash")}</button>
        <button type="button" class="btn btn-primary" id="btnToQuiz">${t("startQuiz")}</button>
        ${returnToMainBtn()}
      </div>`;
    return;
  }

  if(state.phase==="flash"){
    const w=cur();
    if(w) markLearned(w.id);
    if(!w){ el.innerHTML=`<div class="done"><h3>${practiceHeading(t("flashPractice"))}</h3>
      <div class="actions" style="margin-top:1rem">
        <button type="button" class="btn btn-accent" id="btnToQuiz">${t("startQuiz")}</button>
        <button type="button" class="btn btn-primary" id="btnRedraw">${t("learnNew")}</button>
        ${returnToMainBtn()}
      </div></div>`; return; }
    const modes=[["cn2sv", state.uiLang==="en"?t("modeEn2sv"):t("modeCn2sv")],["sv2cn", state.uiLang==="en"?t("modeSv2en"):t("modeSv2cn")],["spell", t("modeSpell")]];
    const prog=`${getIdx()+1} / ${activeBatch().length}`;
    if(state.flashMode==="spell"){
      el.innerHTML=`<h3>${practiceHeading(t("flashPractice"))}</h3><p class="progress">${prog}</p>
        <div class="center">
          <div class="mode-switch">${modes.map(([k,l])=>`<button type="button" class="mode-btn${state.flashMode===k?" active":""}" data-mode="${k}">${l}</button>`).join("")}</div>
          <div class="flash" style="cursor:default"><div class="flash-prompt">${state.uiLang==="en"?t("promptSpellEn"):t("promptSpell")}</div>
            <div class="flash-main">${esc(meaningOf(w))}</div></div>
          <div class="spell-box">
            <input type="text" id="spellInput" placeholder="${t("placeholderSpell")}" autocomplete="off" />
            <div class="feedback ${state.spellFeedback===t("correct")?"ok":state.spellFeedback?"bad":""}" id="spellFb">${esc(state.spellFeedback)}</div>
          </div>
          <div class="actions">
            <button type="button" class="btn-speak" data-speak="${esc(w.swedish)}">${t("speak")}</button>
            <button type="button" class="btn btn-ghost" id="btnCheckSpell">${t("check")}</button>
            <button type="button" class="btn btn-ok" id="btnMastered">${t("mastered")}</button>
            <button type="button" class="btn btn-accent" id="btnAddWB">${t("addWB")}</button>
            <button type="button" class="btn btn-primary" id="btnNext">${t("next")}</button>
          </div>
        </div>`;
      setTimeout(()=>document.getElementById("spellInput")?.focus(),40);
    } else {
      const showMeaning = state.flashMode==="cn2sv";
      const main = showMeaning ? meaningOf(w) : w.swedish;
      const reveal = showMeaning ? w.swedish : meaningOf(w);
      const prompt = showMeaning
        ? (state.uiLang==="en"?t("promptEn2sv"):t("promptCn2sv"))
        : (state.uiLang==="en"?t("promptSv2en"):t("promptSv2cn"));
      el.innerHTML=`<h3>${practiceHeading(t("flashPractice"))}</h3><p class="progress">${prog}</p>
        <div class="center">
          <div class="mode-switch">${modes.map(([k,l])=>`<button type="button" class="mode-btn${state.flashMode===k?" active":""}" data-mode="${k}">${l}</button>`).join("")}</div>
          <div class="flash${state.flipped?" flipped":""}" id="flashCard" tabindex="0" role="button">
            <div class="flash-prompt">${prompt}</div>
            <div class="flash-main">${esc(main)}</div>
            <div class="flash-sub">${state.flipped?esc(reveal):"？"}</div>
            <div class="flash-hint">${state.flipped?(formsHint(w)?formsHint(w)+" · ":"")+esc(w.example):t("revealHint")}</div>
          </div>
          <div class="actions">
            <button type="button" class="btn-speak" data-speak="${esc(w.swedish)}">${t("speak")}</button>
            <button type="button" class="btn btn-ghost" id="btnReveal">${t("showAnswer")}</button>
            <button type="button" class="btn btn-ok" id="btnMastered">${t("mastered")}</button>
            <button type="button" class="btn btn-accent" id="btnAddWB">${t("addWB")}</button>
            <button type="button" class="btn btn-primary" id="btnNext">${t("next")}</button>
          </div>
        </div>`;
    }
    return;
  }

  if(state.phase==="quiz"){
    const w=cur();
    if(w) markLearned(w.id);
    if(!w){ el.innerHTML=`<div class="done"><h3>${practiceHeading(t("quizDone"))}</h3><p>${t("quizDoneHint")}</p>
      <div class="actions" style="margin-top:1rem">
        <button type="button" class="btn btn-primary" id="btnRedraw">${t("learnNew")}</button>
        <button type="button" class="btn btn-ghost" id="btnGoWB2">${t("wordbook")}</button>
        ${returnToMainBtn()}
      </div></div>`; return; }
    const askMeaning = state.quizDir==="cn2sv";
    el.innerHTML=`<h3>${practiceHeading(t("quizTitle"))}</h3>
      <p class="progress">${getIdx()+1} / ${activeBatch().length} · ${askMeaning?(state.uiLang==="en"?t("modeEn2sv"):t("modeCn2sv")):(state.uiLang==="en"?t("modeSv2en"):t("modeSv2cn"))}</p>
      <div class="center">
        <div class="quiz-q">${esc(askMeaning?meaningOf(w):w.swedish)}</div>
        <div class="spell-box">
          <input type="text" id="quizInput" placeholder="${askMeaning?t("placeholderQuizSv"):t("placeholderQuizMeaning")}" autocomplete="off" />
          <div class="feedback ${state.quizFeedback.startsWith(t("correct"))||state.quizFeedback===t("correct")?"ok":state.quizFeedback?"bad":""}">${esc(state.quizFeedback)}</div>
        </div>
        <div class="actions">
          <button type="button" class="btn-speak" data-speak="${esc(w.swedish)}">${t("speak")}</button>
          <button type="button" class="btn btn-ghost" id="btnCheckQuiz">${t("check")}</button>
          <button type="button" class="btn btn-ghost" id="btnShowAns">${t("showCorrect")}</button>
          <button type="button" class="btn btn-primary" id="btnNextQuiz">${t("next")}</button>
        </div>
      </div>`;
    setTimeout(()=>document.getElementById("quizInput")?.focus(),40);
  }
}

function wordItemHtml(w){
  const tags=[];
  if(isMastered(w.id)) tags.push(`<span class="tag yes">${t("tagMastered")}</span>`);
  if(inWordbook(w.id)) tags.push(`<span class="tag wb">${t("tagWB")}</span>`);
  const tr = exampleTrOf(w);
  return `<li class="word-item"><div class="word-top">
    <span class="word-sv">${esc(w.swedish)}</span>
    <span class="word-zh">${esc(meaningOf(w))}</span>
    ${hasForms(w)?`<span class="word-forms">${esc(w.forms)}</span>`:""}
    <button type="button" class="btn-speak" data-speak="${esc(w.swedish)}">${t("speak")}</button>
    ${tags.join("")}
  </div><div class="word-ex">${esc(w.example)}${tr?`<br><span class="word-ex-zh">${esc(tr)}</span>`:""}</div></li>`;
}

function bindVocab(){
  const root=document.getElementById("tab-vocab");
  root.querySelector("#countSelect")?.addEventListener("change",e=>{
    state.count=+e.target.value;
  });
  root.querySelector("#btnConfirm")?.addEventListener("click",()=>{
    state.count=+(document.getElementById("countSelect")?.value || state.count);
    state.practiceSource="main";
    state.batch=buildBatch(); state.index=0; state.phase="list";
    state.flipped=false; state.spellFeedback=""; state.quizFeedback="";
    if(!state.batch.length) alert(t("noPractice"));
    renderVocab();
  });
  root.querySelector(".phase-tabs")?.addEventListener("click",e=>{
    if(e.target.closest("#btnConfirm") || e.target.closest("#countSelect")) return;
    const b=e.target.closest("[data-phase]"); if(!b) return;
    const phase=b.dataset.phase;
    state.flipped=false; state.spellFeedback=""; state.quizFeedback="";
    state.phase=phase;
    const ab=activeBatch();
    if(state.phase!=="wordbook" && state.phase!=="stats" && ab.length && getIdx()>=ab.length) setIdx(0);
    if((state.phase==="quiz") && ab.length){ state.quizDir=Math.random()<.5?"cn2sv":"sv2cn"; }
    renderVocab();
  });

  const body=root.querySelector("#vocabBody");
  body?.addEventListener("click",e=>{
    const tg=e.target;
    if(tg.id==="btnToFlash"||tg.closest("#btnToFlash")){ state.phase="flash"; setIdx(0); state.flipped=false; state.spellFeedback=""; renderVocab(); return; }
    if(tg.id==="btnToQuiz"||tg.closest("#btnToQuiz")){ state.phase="quiz"; setIdx(0); state.quizFeedback=""; state.quizDir=Math.random()<.5?"cn2sv":"sv2cn"; renderVocab(); return; }
    if(tg.id==="btnRedraw"||tg.closest("#btnRedraw")){
      if(isWbPractice()){
        const wb=[...state.wordbook].map(id=>VOCAB.find(w=>w.id===id)).filter(w=>w&&!isMastered(w.id));
        state.wbBatch=shuffle(wb).slice(0, Math.min(state.count, wb.length));
        state.wbIndex=0;
      } else {
        state.batch=buildBatch(); state.index=0;
      }
      state.phase="list"; renderVocab(); return;
    }
    if(tg.id==="btnGoWB2"||tg.closest("#btnGoWB2")){ state.phase="wordbook"; renderVocab(); return; }
    if(tg.id==="btnPracticeWB"){
      const wb=[...state.wordbook].map(id=>VOCAB.find(w=>w.id===id)).filter(w=>w&&!isMastered(w.id));
      if(!wb.length){ alert(t("noWBPractice")); return; }
      state.wbBatch=shuffle(wb).slice(0, Math.min(state.count, wb.length));
      state.wbIndex=0;
      state.practiceSource="wordbook";
      state.phase="list";
      state.flipped=false; state.spellFeedback=""; state.quizFeedback="";
      renderVocab(); return;
    }
    if(tg.id==="btnBackMain"||tg.closest("#btnBackMain")){
      state.practiceSource="main";
      state.phase=state.batch.length?"list":"setup";
      state.flipped=false; state.spellFeedback=""; state.quizFeedback="";
      renderVocab(); return;
    }
    if(tg.id==="btnClearWB"){ if(confirm(t("clearWBConfirm"))){ state.wordbook.clear(); saveSet(LS_WORDBOOK,state.wordbook); renderVocab(); } return; }

    const mode=tg.closest("[data-mode]");
    if(mode){ state.flashMode=mode.dataset.mode; state.flipped=false; state.spellFeedback=""; renderVocabBody(); return; }
    if(tg.id==="flashCard"||tg.closest("#flashCard")){ state.flipped=!state.flipped; renderVocabBody(); return; }
    if(tg.id==="btnReveal"){ state.flipped=true; renderVocabBody(); return; }
    if(tg.id==="btnCheckSpell"){
      const w=cur(); const input=document.getElementById("spellInput"); if(!w||!input) return;
      const ok=norm(input.value)===norm(w.swedish);
      state.spellFeedback=ok?t("correct"):t("incorrectAns")+w.swedish;
      renderVocabBody();
      const again=document.getElementById("spellInput"); if(again) again.value=input.value;
      return;
    }
    if(tg.id==="btnMastered"){
      const w=cur(); if(w){ state.mastered.add(w.id); saveSet(LS_MASTERED,state.mastered); markLearned(w.id); state.wordbook.delete(w.id); saveSet(LS_WORDBOOK,state.wordbook); }
      setIdx(getIdx()+1); state.flipped=false; state.spellFeedback=""; renderVocab(); return;
    }
    if(tg.id==="btnAddWB"){
      const w=cur(); if(w){ state.wordbook.add(w.id); saveSet(LS_WORDBOOK,state.wordbook); alert(t("addedWB")+w.swedish); }
      renderVocab(); return;
    }
    if(tg.id==="btnNext"){ setIdx(getIdx()+1); state.flipped=false; state.spellFeedback=""; renderVocabBody(); return; }

    if(tg.id==="btnCheckQuiz"){
      const w=cur(); const input=document.getElementById("quizInput"); if(!w||!input) return;
      const expect = state.quizDir==="cn2sv" ? w.swedish : meaningOf(w);
      const ok=norm(input.value)===norm(expect);
      state.quizFeedback=ok?t("correct"):t("incorrect");
      renderVocabBody();
      const again=document.getElementById("quizInput"); if(again) again.value=input.value;
      return;
    }
    if(tg.id==="btnShowAns"){
      const w=cur(); if(!w) return;
      const expect = state.quizDir==="cn2sv" ? w.swedish : meaningOf(w);
      state.quizFeedback=t("correctIs")+expect;
      renderVocabBody(); return;
    }
    if(tg.id==="btnNextQuiz"){
      setIdx(getIdx()+1); state.quizFeedback="";
      state.quizDir=Math.random()<.5?"cn2sv":"sv2cn";
      renderVocabBody(); return;
    }
  });
  body?.addEventListener("keydown",e=>{
    if(e.target.id==="spellInput" && e.key==="Enter"){ e.preventDefault(); document.getElementById("btnCheckSpell")?.click(); }
    if(e.target.id==="quizInput" && e.key==="Enter"){ e.preventDefault(); document.getElementById("btnCheckQuiz")?.click(); }
    if(e.target.id==="flashCard" && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); state.flipped=!state.flipped; renderVocabBody(); }
  });
}

function loadGrammarResults(){
  try{ return JSON.parse(localStorage.getItem(LS_GRAMMAR)||"{}") || {}; }
  catch{ return {}; }
}
function saveGrammarResults(map){
  localStorage.setItem(LS_GRAMMAR, JSON.stringify(map));
}
function gLang(){ return state.uiLang === "en" ? "en" : "zh"; }
function gText(obj){
  if(obj == null) return "";
  if(typeof obj === "string") return obj;
  return obj[gLang()] || obj.zh || obj.en || "";
}
function normalizeAns(s){
  return String(s||"").trim().replace(/\s+/g," ").toLowerCase();
}
function answersMatch(user, accepted){
  const u = normalizeAns(user);
  const list = Array.isArray(accepted) ? accepted : [accepted];
  return list.some(a => normalizeAns(a) === u);
}

function renderGrammar(){
  const el = document.getElementById("tab-grammar");
  if(!el) return;
  if(!state.grammarTopic) state.grammarTopic = GRAMMAR_TOPICS[0].id;
  if(!state.grammarAnswers) state.grammarAnswers = {};
  if(!state.grammarChecked) state.grammarChecked = {};
  const results = loadGrammarResults();
  const topic = GRAMMAR_TOPICS.find(x=>x.id===state.grammarTopic) || GRAMMAR_TOPICS[0];
  const sum = topic.summary[gLang()] || topic.summary.zh;
  const checked = !!state.grammarChecked[topic.id];

  const nav = GRAMMAR_TOPICS.map(tp=>{
    const done = results[tp.id] ? `<span class="g-done">✓</span>` : "";
    return `<button type="button" class="g-topic${tp.id===topic.id?" active":""}" data-gtopic="${tp.id}">${esc(gText(tp.title))}${done}</button>`;
  }).join("");

  const tables = (sum.tables||[]).map(tb=>`
    <div class="g-table-wrap"><table class="g-table">
      <caption>${esc(tb.caption||"")}</caption>
      <thead><tr>${tb.headers.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead>
      <tbody>${tb.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody>
    </table></div>`).join("");

  const examples = `<ul class="g-examples">${(sum.examples||[]).map(ex=>`
    <li><span class="sv">${esc(ex.sv)}</span>
      <span class="tr">${esc(gLang()==="en" ? (ex.en||ex.zh||"") : (ex.zh||ex.en||""))}</span>
    </li>`).join("")}</ul>`;

  const answers = state.grammarAnswers[topic.id] || {};
  const exHtml = topic.exercises.map((ex,i)=>{
    const val = answers[i] != null ? answers[i] : "";
    const gloss = gLang()==="en" ? (ex.gloss?.en || ex.gloss?.zh || "") : (ex.gloss?.zh || ex.gloss?.en || "");
    let fb = "";
    if(checked){
      const ok = answersMatch(val, ex.answer);
      const show = Array.isArray(ex.answer) ? ex.answer[0] : ex.answer;
      fb = ok
        ? `<div class="g-fb ok">${t("grammarCorrect")} · ${esc(show)}</div><div class="g-explain">${esc(gText(ex.explain))}</div>`
        : `<div class="g-fb bad">${t("grammarAnswer")}${esc(show)}</div><div class="g-explain">${esc(gText(ex.explain))}</div>`;
    }
    const lemma = ex.lemma ? `<span class="g-lemma">( ${esc(ex.lemma)} )</span>` : "";
    return `<div class="g-ex" data-ex="${i}">
      <div class="g-ex-line">
        <span class="g-sv">${esc(ex.pre || "")}</span>
        <input type="text" class="g-input g-blank" data-ex="${i}" value="${esc(val)}" ${checked?"disabled":""} autocomplete="off" aria-label="${esc(ex.lemma || "answer")}" />
        ${lemma ? " " + lemma : ""}
        <span class="g-sv">${esc(ex.post || "")}</span>
      </div>
      ${gloss?`<div class="g-gloss">${esc(gloss)}</div>`:""}
      ${fb}
    </div>`;
  }).join("");

  let scoreBox = "";
  if(checked){
    let okc = 0;
    topic.exercises.forEach((ex,i)=>{ if(answersMatch(answers[i], ex.answer)) okc++; });
    scoreBox = `<div class="g-score">${t("grammarScore")}: ${okc} / ${topic.exercises.length}</div>`;
  }

  el.innerHTML = `<div class="grammar-layout">
    <aside class="grammar-nav">
      <div class="grammar-nav-title">${t("grammarTopics")}</div>
      ${nav}
    </aside>
    <div class="grammar-main">
      <div class="card">
        <h3>${t("grammarSummary")} · ${esc(gText(topic.title))}</h3>
        <p>${esc(sum.intro||"")}</p>
        <ul class="g-rules">${(sum.rules||[]).map(r=>`<li>${esc(r)}</li>`).join("")}</ul>
        ${tables}
        ${examples}
      </div>
      <div class="card">
        <h3>${t("grammarPractice")}</h3>
        <p class="progress">${t("grammarFillHint")}</p>
        <div id="grammarExList">${exHtml}</div>
        ${scoreBox}
        <div class="actions" style="margin-top:1rem;justify-content:flex-start">
          ${checked
            ? `<button type="button" class="btn btn-accent" id="btnGrammarRetry">${t("grammarRetry")}</button>`
            : `<button type="button" class="btn btn-primary" id="btnGrammarSubmit">${t("grammarSubmit")}</button>`}
        </div>
      </div>
    </div>
  </div>`;

  el.querySelectorAll("[data-gtopic]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.grammarTopic = btn.dataset.gtopic;
      renderGrammar();
    });
  });
  el.querySelectorAll(".g-input").forEach(inp=>{
    inp.addEventListener("input", ()=>{
      if(!state.grammarAnswers[topic.id]) state.grammarAnswers[topic.id] = {};
      state.grammarAnswers[topic.id][+inp.dataset.ex] = inp.value;
    });
  });
  el.querySelector("#btnGrammarSubmit")?.addEventListener("click", ()=>{
    const map = {};
    el.querySelectorAll(".g-input").forEach(inp=>{ map[+inp.dataset.ex] = inp.value; });
    state.grammarAnswers[topic.id] = map;
    let okc = 0;
    topic.exercises.forEach((ex,i)=>{ if(answersMatch(map[i], ex.answer)) okc++; });
    const results = loadGrammarResults();
    results[topic.id] = { score: okc, total: topic.exercises.length, at: Date.now() };
    saveGrammarResults(results);
    state.grammarChecked[topic.id] = true;
    renderGrammar();
  });
  el.querySelector("#btnGrammarRetry")?.addEventListener("click", ()=>{
    state.grammarChecked[topic.id] = false;
    state.grammarAnswers[topic.id] = {};
    renderGrammar();
  });
}
