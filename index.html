<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>瑞典语学习 / Swedish Learning</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/themes.css" />
<script src="js/ui.js"></script>
</head>
<body>
<div class="app">
  <!-- HOME -->
  <section class="view active" id="view-home">
    <div class="topbar">
      <div class="brand"><span id="homeBrand">瑞典语学习</span><small>Svenska för dig</small></div>
      <div class="top-actions">
        <label class="lang-label" for="langSelect" id="langLabel">语言 / Language</label>
        <select id="langSelect" aria-label="语言 / Language">
          <option value="zh">中文</option>
          <option value="en">English</option>
        </select>
        <button type="button" class="btn btn-accent" id="btnStart">开始学习 / Start</button>
        <button type="button" class="btn-theme" id="btnThemeHome" aria-label="Toggle theme" title="Toggle theme">🌙</button>
      </div>
    </div>
    <div class="hero">
      <div class="hero-flag"></div>
      <h1>Hej!</h1>
      <div class="hero-landmark">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/76/Panorama_Gamla_stan_2012.jpg/1280px-Panorama_Gamla_stan_2012.jpg" alt="Stockholm Gamla stan panorama" width="1280" height="300" loading="lazy" decoding="async" referrerpolicy="no-referrer" />
      </div>
      <p id="homeSubtitle">欢迎来到瑞典语学习网，选择语言后开始学习</p>
    </div>
  </section>

  <!-- LEARN -->
  <section class="view" id="view-learn">
    <div class="topbar">
      <div class="brand"><span id="learnBrand">瑞典语学习</span><small>Svenska för dig</small></div>
      <div class="top-actions">
        <button type="button" class="btn btn-accent" id="btnHome">返回首页</button>
        <button type="button" class="btn-theme" id="btnThemeLearn" aria-label="Toggle theme" title="Toggle theme">🌙</button>
      </div>
    </div>
    <div class="page-head"><h2 id="learnTitle">词汇</h2><p id="learnSub">高频词汇学习</p></div>
    <nav class="tabs" id="learnTabs">
      <button type="button" class="tab active" data-tab="vocab" id="tabBtnVocab">词汇</button>
      <button type="button" class="tab" data-tab="grammar" id="tabBtnGrammar">语法</button>
      <button type="button" class="tab" data-tab="speaking" id="tabBtnSpeaking">口语</button>
      <button type="button" class="tab" data-tab="progress" id="tabBtnProgress">学习进度</button>
    </nav>
    <div class="panel active" id="tab-vocab"></div>
    <div class="panel" id="tab-grammar"></div>
    <div class="panel" id="tab-speaking"></div>
    <div class="panel" id="tab-progress"></div>
  </section>
</div>
<script src="data/vocabulary.js"></script>
<script src="js/storage.js"></script>
<script src="js/vocabulary.js"></script>
<script src="js/progress.js"></script>
<script src="js/grammar.js"></script>
<script src="js/speaking.js"></script>
<script src="js/app.js"></script>
</body>
</html>
